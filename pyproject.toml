[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyLabRobot"
description = "A hardware agnostic platform for lab automation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dynamic = ["version"]
dependencies = ["typing_extensions", "websockets"]

[project.optional-dependencies]
serial = ["pyserial"]
usb = ["pyusb", "libusb-package"]
ftdi = ["pylibftdi", "pyusb"]
hid = ["hid"]
modbus = ["pymodbus>=3.0.0,<3.7.0"]
opentrons = ["opentrons-http-api-client==0.2.1"]
distributed = ["grpcio>=1.62.3", "protobuf>=4.25.1"]
sila = ["PyLabRobot[distributed]", "zeroconf>=0.131.0"]
liconic-server = ["PyLabRobot[serial,distributed]"]
cytation-microscopy = ["numpy>=1.26", "opencv-python", "PyGObject"]
pico = ["PyLabRobot[sila]", "opencv-python", "numpy"]
xarm = ["xarm-python-sdk"]
all = ["PyLabRobot[serial,usb,ftdi,hid,modbus,websockets,visualizer,opentrons,distributed,sila,liconic-server,pico,xarm]"]
test = [
  "pytest",
  "pytest-timeout",
]
dev = [
  "PyLabRobot[all,test]",
  "grpcio-tools==1.62.3",

  # lint/type
  "mypy==1.18.2",
  "ruff==0.15.4",

  # docs
  "sphinx-reredirects",
  "nbconvert",
  "sphinx-sitemap",
  "pydata-sphinx-theme",
  "myst_nb",
  "sphinx_copybutton",
]

[project.urls]
Homepage = "https://github.com/pylabrobot/pylabrobot"

[tool.setuptools.dynamic]
version = {file = "pylabrobot/version.txt"}

[tool.setuptools.packages.find]
namespaces = false
exclude = ["tools*", "docs*"]

[tool.setuptools.package-data]
pylabrobot = [
  "visualizer/*",
  "visualizer/img/*",
  "liconic/storex/experimental_server/*.md",
  "liconic/storex/experimental_server/*.proto",
  "version.txt",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
