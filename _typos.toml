[default.extend-words]
# words that should not be corrected
OT = "OT"
ot = "ot"
ser = "ser"
ba = "ba"
nd = "nd"
PN = "PN"
FO = "FO"
UE = "UE"
commutated = "commutated"
commutating = "commutating"
DOUT = "DOUT"
inconsistence = "inconsistence"
mis = "mis"
RHE = "RHE"
"ASEND" = "ASEND"
caf = "caf"

# Sartorius Entris II, a product name.
Entris = "Entris"

# FluidX IntelliXcap firmware vocabulary. `*WasNotSuccesful` are fault tokens
# keyed in ERROR_MESSAGES and passed to _wait_for_idle as the expected error
# frame; `onnOK` and `LOK` are reply frames. Renaming them breaks the driver.
Succesful = "Succesful"
onn = "onn"
LOK = "LOK"

# HighRes LidValet settings keys. HighResLidValetSettings.from_lines matches
# each dataclass field name uppercased against the device's `settings` output,
# so these spellings are the device's, not ours.
ouput = "ouput"
hegiht = "hegiht"

# BTX Gemini X2 firmware/OCR vocabulary. `scap` is the RSI framebuffer
# command; the misspelled protocol variants are OCR corrections.
scap = "scap"
protocals = "protocals"
protocal = "protocal"

# Celigo vendor XML schema identifiers. These spellings appear in instrument
# configuration files and must remain exact for configuration loading.
Accleration = "Accleration"
Tranformation = "Tranformation"
tranformation = "tranformation"

# Prep firmware interface names, as the device's firmware tree reports them:
# `IYAxis`, `IYDrive`, `IZAxis`, `IZDrive`. The recordings are what the device
# said, so the spellings are its own.
IY = "IY"
IZ = "IZ"

# glTF material property, the name three.js and the glTF spec use for it.
metalness = "metalness"

# "unparseable" is an accepted English variant used by the Opentrons version parser.
unparseable = "unparseable"

[default.extend-identifiers]
# Prep firmware interface names, spelled as its firmware trees name them.
IYAxis = "IYAxis"
IYDrive = "IYDrive"
IZAxis = "IZAxis"
IZDrive = "IZDrive"

[files]
extend-exclude = [
    "*.ipynb",
    # Third-party libraries, shipped as their authors minified them.
    "pylabrobot/visualizer3D/static/vendor/**",
]
