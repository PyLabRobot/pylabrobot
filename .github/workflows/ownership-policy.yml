name: Ownership policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [Ownership review event]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    if: github.repository == 'PyLabRobot/pylabrobot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the main branch may access this environment's App private key.
    environment: ownership-policy
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github
      - name: Create scoped App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.OWNERSHIP_APP_ID }}
          private-key: ${{ secrets.OWNERSHIP_APP_PRIVATE_KEY }}
          owner: PyLabRobot
          repositories: pylabrobot
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
      - name: Check live ownership and reviews
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNERSHIP_APP_ID: ${{ vars.OWNERSHIP_APP_ID }}
        run: python3 .github/ownership/check.py
