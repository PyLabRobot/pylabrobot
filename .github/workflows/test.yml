name: Unit Tests

on:
  push:
    branches:
     - main
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request makes a running test run obsolete; every other run, e.g.
# each push to main, gets a group of its own, so none waits on or cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-all:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        version: ["3.10", 3.11, 3.12, 3.13, 3.14]

    name: Tests (all, py${{ matrix.version }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          version: ${{ matrix.version }}
          extra: all

  test-extras:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        extra: ["<none>", serial, usb, ftdi, hid, btx, modbus, opentrons, sila, cytation-microscopy, pico, rpc-dev, "celigo,rpc-dev"]

    name: Tests (${{ matrix.extra }}, py3.12)
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          version: "3.12"
          extra: ${{ matrix.extra }}

      - name: Verify generated bindings
        if: matrix.extra == 'celigo,rpc-dev'
        run: |
          make generate-rpc
          git diff --exit-code -- pylabrobot/rpc/v1 pylabrobot/revvity/celigo/grpc/v1
