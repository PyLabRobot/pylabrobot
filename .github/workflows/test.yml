name: Unit Tests

on:
  push:
    branches:
     - main
  pull_request:
  pull_request_review:
  workflow_dispatch:

# A newer push to the same pull request makes a running test run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-all:
    if: github.event_name != 'pull_request_review'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        version: ["3.10", 3.11, 3.12, 3.13, 3.14]

    name: ${{ github.event_name == 'pull_request_review' && 'Review notification' || 'Tests' }} (all, py${{ matrix.version }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          version: ${{ matrix.version }}
          extra: all

  test-extras:
    if: github.event_name != 'pull_request_review'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        extra: ["<none>", serial, usb, ftdi, hid, btx, modbus, opentrons, sila, cytation-microscopy, pico]

    name: ${{ github.event_name == 'pull_request_review' && 'Review notification' || 'Tests' }} (${{ matrix.extra }}, py3.12)
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          version: "3.12"
          extra: ${{ matrix.extra }}
