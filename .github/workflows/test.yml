name: Unit Tests

on:
  push:
    branches:
     - main
  pull_request:
  pull_request_review:
  workflow_dispatch:

jobs:
  test-all:
    if: github.event_name != 'pull_request_review'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        version: [3.9, "3.10", 3.11, 3.12, 3.13, 3.14]

    name: ${{ github.event_name == 'pull_request_review' && 'Review notification' || 'Tests' }} (all, py${{ matrix.version }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          version: ${{ matrix.version }}
          extra: all

  test-extras:
    if: github.event_name != 'pull_request_review'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        extra: ["<none>", serial, usb, ftdi, hid, btx, modbus, opentrons, sila, cytation-microscopy, pico, rpc-dev, "celigo,rpc-dev"]

    name: ${{ github.event_name == 'pull_request_review' && 'Review notification' || 'Tests' }} (${{ matrix.extra }}, py3.12)
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          version: "3.12"
          extra: ${{ matrix.extra }}

      - name: Verify generated bindings
        if: matrix.extra == 'celigo,rpc-dev'
        run: |
          python -m grpc_tools.protoc -I. --python_out=. --pyi_out=. --grpc_python_out=. \
            pylabrobot/rpc/v1/device.proto pylabrobot/rpc/v1/jobs.proto \
            pylabrobot/rpc/v1/images.proto pylabrobot/revvity/celigo/grpc/v1/service.proto \
            pylabrobot/revvity/celigo/grpc/v1/storage.proto
          git diff --exit-code -- pylabrobot/rpc/v1 pylabrobot/revvity/celigo/grpc/v1
