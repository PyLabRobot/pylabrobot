name: "Run Tests"
description: "Sets up Python, installs dependencies, and runs tests"
inputs:
  version:
    description: "Python version"
    required: true
  extra:
    description: "Optional dependency to install"
    required: true
runs:
  using: "composite"
  steps:
    - name: Update packages
      run: sudo apt-get update
      shell: bash
    - name: Install PyGObject build dependencies
      # PyGObject has no wheels, so pip builds it from source. Its build needs
      # cairo (via pycairo) and girepository headers, which the runner lacks.
      # Only the cytation-microscopy extra pulls it in; `all` does not.
      run: |
        if [ "${{ inputs.extra }}" = "cytation-microscopy" ]; then
          sudo apt-get install -y pkg-config libcairo2-dev libglib2.0-dev
          sudo apt-get install -y libgirepository-2.0-dev \
            || sudo apt-get install -y libgirepository1.0-dev
        fi
      shell: bash
    - name: Install BTX OCR system dependency
      if: ${{ inputs.extra == 'btx' || inputs.extra == 'all' }}
      run: sudo apt-get install -y tesseract-ocr
      shell: bash
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.version }}
    - name: Install Dependencies
      run: |
        if [ "${{ inputs.extra }}" = "<none>" ]; then
          pip install -e '.[test]'
        else
          pip install -e '.[test,${{ inputs.extra }}]'
        fi
      shell: bash
    - name: Run Pytest
      run: make test
      shell: bash
