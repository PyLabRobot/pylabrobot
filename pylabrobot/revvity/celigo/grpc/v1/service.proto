syntax = "proto3";

package celigo.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/duration.proto";
import "pylabrobot/rpc/v1/device.proto";
import "pylabrobot/rpc/v1/jobs.proto";

message InitializationRequest {
  string device_id = 1;
  string request_id = 2;
  string configuration_id = 3;
}

message BrightfieldSettings {
  optional double sample_x_mm = 1;
  optional double sample_y_mm = 2;
  optional double z_mm = 3;
  optional double exposure_ms = 4;
  optional double gain = 5;
  bool machine_auto_exposure = 6;
}

message BrightfieldRequest {
  string device_id = 1;
  string request_id = 2;
  string configuration_id = 3;
  BrightfieldSettings settings = 4;
}

message CloseDoorRequest {
  string device_id = 1;
  optional double sample_x_mm = 2;
  optional double sample_y_mm = 3;
}

message CeligoJobSpecification {
  BrightfieldSettings capture = 1; // Absent for initialization and planned scans.
  uint32 width = 2;
  uint32 height = 3;
  ScanPlan scan_plan = 4;
}

message CeligoConfiguration {
  string configuration_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  repeated string channels = 4;
  double calibrated_brightfield_z_mm = 5;
  double minimum_z_mm = 6;
  double maximum_z_mm = 7;
  string capture_contract = 8;
  double maximum_exposure_ms = 9;
  double maximum_gain = 10;
  double default_scan_exposure_ms = 11;
  double default_scan_gain = 12;
  repeated AutofocusMethod autofocus_methods = 13;
  bool auto_exposure_supported = 14;
}

message AcquisitionMetadata {
  string channel = 1;
  double exposure_ms = 2;
  double gain = 3;
  double sample_x_mm = 4;
  double sample_y_mm = 5;
  double z_mm = 6;
  string focus_method = 7;
  double stage_x_mm = 8;
  double stage_y_mm = 9;
  double galvo_x_volts = 10;
  double galvo_y_volts = 11;
  string configuration_id = 12;
  optional uint32 planned_frame_index = 13;
  optional uint32 block_index = 14;
  optional uint32 tile_row = 15;
  optional uint32 tile_column = 16;
  optional string label = 17;
  optional double focus_score = 18;
  bool machine_auto_exposure = 19;
}

message ScanRegion {
  double left_mm = 1;
  double top_mm = 2;
  double right_mm = 3;
  double bottom_mm = 4;
}

message SamplePoint {
  double x_mm = 1;
  double y_mm = 2;
  optional string label = 3;
}

message PointGeometry {
  repeated SamplePoint centers = 1;
  uint32 block_columns = 2;
  uint32 block_rows = 3;
}

message RandomGeometry {
  ScanRegion bounds = 1;
  uint32 count = 2;
  uint32 block_columns = 3;
  uint32 block_rows = 4;
  sint64 seed = 5;
  optional bool non_overlapping = 6; // Defaults to true when omitted.
}

message CaptureSettings {
  string channel = 1;
  optional double exposure_ms = 2;
  optional double gain = 3;
  bool machine_auto_exposure = 4;
}

enum AutofocusMethod {
  AUTOFOCUS_NONE = 0;
  AUTOFOCUS_IMAGE = 1;
}

message ScanSpecification {
  oneof geometry {
    PointGeometry points = 1;
    RandomGeometry random = 2;
    ScanRegion full_coverage = 3;
  }
  repeated CaptureSettings captures = 4;
  AutofocusMethod autofocus = 5;
  optional double initial_brightfield_z_mm = 6;
}

message ScanEstimateModel {
  optional double seconds_per_frame = 1;
  optional double seconds_per_stage_position = 2;
  optional double seconds_per_autofocus = 3;
  optional uint32 bytes_per_pixel = 4;
}

message ScanBlock {
  uint32 index = 1;
  double center_x_mm = 2;
  double center_y_mm = 3;
  double stage_x_mm = 4;
  double stage_y_mm = 5;
  ScanRegion bounds = 6;
  uint32 block_columns = 7;
  uint32 block_rows = 8;
  optional string label = 9;
}

message ScanPosition {
  uint32 index = 1;
  uint32 block_index = 2;
  uint32 tile_row = 3;
  uint32 tile_column = 4;
  double sample_x_mm = 5;
  double sample_y_mm = 6;
  double galvo_offset_x_mm = 7;
  double galvo_offset_y_mm = 8;
}

message PlannedFrame {
  uint32 index = 1;
  uint32 block_index = 2;
  ScanPosition position = 3;
  CaptureSettings capture = 4;
}

message ScanPlan {
  ScanSpecification specification = 1;
  string configuration_fingerprint = 2;
  repeated ScanBlock blocks = 3;
  repeated PlannedFrame frames = 4;
  ScanEstimateModel estimate_model = 5;
  uint32 frame_count = 6;
  uint32 stage_position_count = 7;
  uint32 autofocus_count = 8;
  double sampled_area_mm2 = 9;
  google.protobuf.Duration estimated_duration = 10;
  uint64 estimated_storage_bytes = 11;
}

message BuildScanPlanRequest {
  string device_id = 1;
  ScanSpecification specification = 2;
  ScanEstimateModel estimate_model = 3;
}

message CreateScanRequest {
  string device_id = 1;
  string request_id = 2;
  string configuration_id = 3;
  ScanPlan plan = 4;
}

service CeligoService {
  rpc GetConfiguration(pylabrobot.rpc.v1.DeviceRequest) returns (CeligoConfiguration);
  rpc BuildScanPlan(BuildScanPlanRequest) returns (ScanPlan);
  rpc CreateScan(CreateScanRequest) returns (pylabrobot.rpc.v1.JobRef);
  rpc GetScanPlan(pylabrobot.rpc.v1.JobRef) returns (ScanPlan);
  // Drawer commands wait for motion to finish. Disconnecting does not stop motion.
  rpc OpenDoor(pylabrobot.rpc.v1.DeviceRequest) returns (google.protobuf.Empty);
  rpc CloseDoor(CloseDoorRequest) returns (google.protobuf.Empty);
  rpc CreateInitialization(InitializationRequest) returns (pylabrobot.rpc.v1.JobRef);
  rpc CreateBrightfieldCapture(BrightfieldRequest) returns (pylabrobot.rpc.v1.JobRef);
}
