syntax = "proto3";

package pylabrobot.liconic.storex.v1;

// The service owns the StoreX resource tree. A workcell receives a copy of a
// plate only through the loading-tray transfer protocol.
service StoreXService {
  rpc GetState(Empty) returns (StoreXState);
  rpc Initialize(Empty) returns (Empty);

  rpc FetchPlate(FetchPlateRequest) returns (PlateSnapshot);
  rpc ClaimTrayPlate(ClaimTrayPlateRequest) returns (ClaimTrayPlateResponse);
  rpc CompleteTransfer(TransferRequest) returns (Empty);
  rpc ReleaseTransfer(TransferRequest) returns (Empty);

  rpc RegisterTrayPlate(RegisterTrayPlateRequest) returns (PlateSnapshot);
  rpc StoreTrayPlate(StoreTrayPlateRequest) returns (StoredPlate);
}

message Empty {}

message PlateSnapshot {
  string name = 1;
  string resource_json = 2;
}

message ActiveTransfer {
  string transfer_id = 1;
  string plate_name = 2;
}

message ActiveOperation {
  string name = 1;
  optional string plate_name = 2;
}

message StoreXState {
  string storex_resource_json = 1;
  optional ActiveTransfer active_transfer = 2;
  optional ActiveOperation active_operation = 3;
}

message FetchPlateRequest {
  string plate_name = 1;
  bool read_barcode = 2;
}

message ClaimTrayPlateRequest {
  // Generated by the caller. Retrying with the same ID returns the same claim.
  string transfer_id = 1;
}

message ClaimTrayPlateResponse {
  string transfer_id = 1;
  PlateSnapshot plate = 2;
}

message TransferRequest {
  string transfer_id = 1;
}

message RegisterTrayPlateRequest {
  // A serialized pylabrobot.resources.Plate owned by the calling workcell.
  string resource_json = 1;
}

message SiteAddress {
  // Both fields are one-based, matching the StoreX controller and cassette labels.
  uint32 cassette = 1;
  uint32 position = 2;
}

message SmallestFit {}

message RandomFit {}

message StoreTrayPlateRequest {
  // Makes a retried request observable when the plate is already in storage.
  string plate_name = 1;

  oneof destination {
    SiteAddress site = 2;
    SmallestFit smallest_fit = 3;
    RandomFit random_fit = 4;
  }

  bool read_barcode = 5;
}

message StoredPlate {
  PlateSnapshot plate = 1;
  SiteAddress site = 2;
}
